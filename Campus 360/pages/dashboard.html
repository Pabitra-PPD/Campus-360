<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Campus 360 Smart Dashboard — Real-time academic tracking, administrative control center, and campus utilities." />
  <title>Smart Dashboard | Campus 360</title>
  
  <link rel="stylesheet" href="../css/dark-theme.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .dashboard-grid-student {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .stat-metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
    }

    .stat-metric-card:hover {
      border-color: rgba(0, 240, 255, 0.3);
      transform: translateY(-2px);
    }

    .stat-metric-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .subject-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: var(--bg-deep);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .admin-metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    table.cyber-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.86rem;
    }

    table.cyber-table th {
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    table.cyber-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    table.cyber-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    @media (max-width: 900px) {
      .dashboard-grid-student {
        grid-template-columns: 1fr;
      }
      .admin-metrics-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body data-page="dashboard">

  <main class="container" style="padding-top: 24px; padding-bottom: 64px;">
    
    <!-- Render Container for Student vs Admin Views -->
    <div id="dashboard-view-root"></div>

  </main>

  <!-- Universal Action Modal -->
  <div class="modal-backdrop-custom" id="action-modal">
    <div class="modal-container-custom" id="action-modal-box"></div>
  </div>

  <!-- Transport Schedules Modal -->
  <div class="modal-backdrop-custom" id="transport-modal">
    <div class="modal-container-custom" style="max-width: 620px;">
      <div class="modal-header-custom">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="bus" style="width: 20px; height: 20px; color: var(--cyan-primary);"></i>
          <h3 style="font-size: 1.15rem;">Campus Transport Bus Routes</h3>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="close-transport-modal">✕</button>
      </div>
      <div class="modal-body-custom" id="transport-modal-body"></div>
    </div>
  </div>

  <!-- Canteen Specials & Operating Hours Modal -->
  <div class="modal-backdrop-custom" id="canteen-modal">
    <div class="modal-container-custom" style="max-width: 600px;">
      <div class="modal-header-custom">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="coffee" style="width: 20px; height: 20px; color: #fbbf24;"></i>
          <h3 style="font-size: 1.15rem;">Central Food Court & Canteen Menu</h3>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="close-canteen-modal">✕</button>
      </div>
      <div class="modal-body-custom" id="canteen-modal-body"></div>
    </div>
  </div>

  <!-- Emergency Contacts Modal -->
  <div class="modal-backdrop-custom" id="emergency-modal">
    <div class="modal-container-custom" style="max-width: 520px;">
      <div class="modal-header-custom">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="phone-call" style="width: 20px; height: 20px; color: var(--rose-danger);"></i>
          <h3 style="font-size: 1.15rem;">Emergency & Safety Contacts</h3>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="close-emergency-modal">✕</button>
      </div>
      <div class="modal-body-custom" id="emergency-modal-body"></div>
    </div>
  </div>

  <!-- Grievance / Feedback Submission Modal -->
  <div class="modal-backdrop-custom" id="feedback-modal">
    <div class="modal-container-custom" style="max-width: 540px;">
      <div class="modal-header-custom">
        <h3 style="font-size: 1.15rem;">Report Issue or Submit Feedback</h3>
        <button type="button" class="btn btn-secondary btn-sm" id="close-feedback-modal">✕</button>
      </div>
      <div class="modal-body-custom">
        <form id="feedback-submit-form">
          <div class="form-group">
            <label class="form-label">Issue Category</label>
            <select class="form-control" id="fb-category">
              <option value="Facilities & Infrastructure">Facilities & Infrastructure</option>
              <option value="Wi-Fi & Network">Wi-Fi & Network</option>
              <option value="Academics & Schedule">Academics & Schedule</option>
              <option value="Canteen & Hygiene">Canteen & Food Court</option>
              <option value="General">General Inquiry</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Subject / Title</label>
            <input type="text" class="form-control" id="fb-title" placeholder="e.g. Projector audio cable in Seminar Hall 2" required />
          </div>
          <div class="form-group">
            <label class="form-label">Detailed Description</label>
            <textarea class="form-control" id="fb-desc" placeholder="Provide exact room, equipment, or details for administrative action..." required></textarea>
          </div>
          <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 18px;">
            A unique tracking ID (e.g. ISSUE-2026-XXX) will be generated. You can track status directly on your dashboard.
          </p>
          <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" class="btn btn-secondary" id="cancel-fb-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Generate Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/db.js"></script>
  <script src="../js/page-shell.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderDashboard();
      initUtilityModalEvents();

      window.addEventListener('campus:db-change', () => {
        renderDashboard();
      });
      window.addEventListener('campus:auth-change', () => {
        renderDashboard();
      });
    });

    function renderDashboard() {
      const root = document.getElementById('dashboard-view-root');
      if (!root) return;

      const user = window.CampusDB.getCurrentUser();
      const isAdmin = window.CampusDB.isAdmin();

      if (isAdmin) {
        renderAdminDashboard(root, user);
      } else {
        renderStudentDashboard(root, user);
      }

      window.refreshLucideIcons();
    }

    // ----------------------------------------------------
    // STUDENT DASHBOARD RENDERER
    // ----------------------------------------------------
    function renderStudentDashboard(root, user) {
      const attendance = window.CampusDB.getAttendanceSummary();
      const timetableToday = window.CampusDB.getTimetable('Monday');
      const assignments = window.CampusDB.getAssignments();
      const pendingAssignments = assignments.filter(a => a.status === 'pending');
      const exams = window.CampusDB.getExamsSchedule();
      const feedback = window.CampusDB.getFeedbackReports();

      root.innerHTML = `
        <div class="page-header-wrap">
          <div class="page-header-flex">
            <div>
              <span class="badge badge-cyan" style="margin-bottom: 8px;">🎓 Student Academic Console</span>
              <h1 class="page-title">Welcome back, ${user ? user.name : 'Student'}</h1>
              <p class="page-subtitle">
                ${user ? user.department : 'Engineering'} • ${user ? user.year : '3rd Year'} • Roll: <strong>${user ? user.rollNo : '21BCSE042'}</strong> • ID: <code>${user ? user.id : 'STU-2024'}</code>
              </p>
            </div>
            <div style="display: flex; gap: 10px;">
              <a href="academics.html" class="btn btn-secondary btn-sm">
                <i data-lucide="book-open" style="width: 14px; height: 14px;"></i>
                Study Notes
              </a>
              <a href="campus-life.html" class="btn btn-primary btn-sm">
                <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i>
                Campus Events
              </a>
            </div>
          </div>
        </div>

        <!-- D. CAMPUS UTILITIES QUICK-ACCESS BAR -->
        <div class="utilities-nav-grid" id="utilities">
          <a href="campus-life.html#lost-found" class="utility-shortcut-card">
            <div class="utility-icon-box" style="color: #fda4af; background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.25);">
              <i data-lucide="search" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Lost & Found</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Report / Claim</span>
            </div>
          </a>

          <a href="campus-life.html#map" class="utility-shortcut-card">
            <div class="utility-icon-box" style="color: #38bdf8; background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.25);">
              <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Campus Map</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Class / Lab Routes</span>
            </div>
          </a>

          <div class="utility-shortcut-card" id="open-transport-trigger" role="button" tabindex="0">
            <div class="utility-icon-box" style="color: #34d399; background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.25);">
              <i data-lucide="bus" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Transport</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Bus Schedules</span>
            </div>
          </div>

          <div class="utility-shortcut-card" id="open-canteen-trigger" role="button" tabindex="0">
            <div class="utility-icon-box" style="color: #fbbf24; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.25);">
              <i data-lucide="coffee" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Canteen Menu</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Specials & Hours</span>
            </div>
          </div>

          <div class="utility-shortcut-card" id="open-emergency-trigger" role="button" tabindex="0">
            <div class="utility-icon-box" style="color: #f43f5e; background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.25);">
              <i data-lucide="phone-call" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Emergency</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Clinic & Security</span>
            </div>
          </div>

          <div class="utility-shortcut-card" id="open-feedback-trigger" role="button" tabindex="0">
            <div class="utility-icon-box" style="color: #c084fc; background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.25);">
              <i data-lucide="message-square" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
              <strong style="font-size: 0.85rem; color: var(--text-primary); display: block;">Grievance / Help</strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">Track Tickets</span>
            </div>
          </div>
        </div>

        <!-- Metric Stat Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-bottom: 28px;">
          <div class="stat-metric-card">
            <div class="stat-metric-icon" style="background: rgba(0, 240, 255, 0.1); color: var(--cyan-primary);">
              <i data-lucide="percent" style="width: 24px; height: 24px;"></i>
            </div>
            <div>
              <span style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Overall Attendance</span>
              <h3 style="font-size: 1.4rem; color: ${attendance.overall >= 75 ? '#34d399' : '#f43f5e'};">
                ${attendance.overall}%
              </h3>
              <span style="font-size: 0.75rem; color: var(--text-secondary);">${attendance.totalAttended} / ${attendance.totalConducted} Lectures</span>
            </div>
          </div>

          <div class="stat-metric-card">
            <div class="stat-metric-icon" style="background: rgba(168, 85, 247, 0.1); color: #c084fc;">
              <i data-lucide="award" style="width: 24px; height: 24px;"></i>
            </div>
            <div>
              <span style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Current CGPA</span>
              <h3 style="font-size: 1.4rem; color: #c084fc;">8.85 / 10</h3>
              <span style="font-size: 0.75rem; color: var(--text-secondary);">Top 5% in CSE Dept</span>
            </div>
          </div>

          <div class="stat-metric-card">
            <div class="stat-metric-icon" style="background: rgba(245, 158, 11, 0.1); color: #fbbf24;">
              <i data-lucide="file-text" style="width: 24px; height: 24px;"></i>
            </div>
            <div>
              <span style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Pending Tasks</span>
              <h3 style="font-size: 1.4rem; color: #fbbf24;">${pendingAssignments.length} Assignments</h3>
              <span style="font-size: 0.75rem; color: var(--text-secondary);">Next due in 3 days</span>
            </div>
          </div>

          <div class="stat-metric-card">
            <div class="stat-metric-icon" style="background: rgba(56, 189, 248, 0.1); color: #38bdf8;">
              <i data-lucide="calendar" style="width: 24px; height: 24px;"></i>
            </div>
            <div>
              <span style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Spring Exams</span>
              <h3 style="font-size: 1.4rem; color: #38bdf8;">March 2</h3>
              <span style="font-size: 0.75rem; color: var(--text-secondary);">${exams.length} papers scheduled</span>
            </div>
          </div>
        </div>

        <div class="dashboard-grid-student">
          
          <!-- Left Column: Timetable & Assignments -->
          <div style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Today's Schedule -->
            <div class="feature-card" style="padding: 24px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                  <i data-lucide="clock" style="width: 20px; height: 20px; color: var(--cyan-primary);"></i>
                  <h3 style="font-size: 1.15rem;">Today's Class Schedule (Monday)</h3>
                </div>
                <a href="academics.html" class="link-btn" style="font-size: 0.8rem; color: var(--cyan-primary);">Weekly View →</a>
              </div>

              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${timetableToday.map(period => `
                  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
                    <div style="display: flex; align-items: center; gap: 14px;">
                      <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(0, 240, 255, 0.08); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--cyan-primary);">
                        P${period.period}
                      </div>
                      <div>
                        <strong style="font-size: 0.9rem; color: var(--text-primary); display: block;">${period.subject}</strong>
                        <span style="font-size: 0.78rem; color: var(--text-secondary);">${period.faculty} • Room ${period.room}</span>
                      </div>
                    </div>
                    <div style="text-align: right;">
                      <span class="badge ${period.type === 'Lab' ? 'badge-violet' : 'badge-cyan'}">${period.type}</span>
                      <span style="display: block; font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px;">${period.time}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Pending Assignments -->
            <div class="feature-card" style="padding: 24px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                  <i data-lucide="file-check-2" style="width: 20px; height: 20px; color: #fbbf24;"></i>
                  <h3 style="font-size: 1.15rem;">Assignments & Submissions</h3>
                </div>
                <span class="badge badge-amber">${pendingAssignments.length} Action Needed</span>
              </div>

              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${assignments.map(asg => `
                  <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 14px; background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
                    <div style="flex: 1; min-width: 240px;">
                      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                        <span class="badge ${asg.status === 'submitted' ? 'badge-emerald' : 'badge-amber'}">${asg.status === 'submitted' ? 'Submitted' : 'Pending'}</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);">${asg.code}</span>
                      </div>
                      <strong style="font-size: 0.9rem; color: var(--text-primary); display: block;">${asg.title}</strong>
                      <span style="font-size: 0.78rem; color: var(--text-secondary);">${asg.subject} • Due: ${asg.dueDate} (Max Marks: ${asg.totalMarks})</span>
                    </div>
                    <div>
                      ${asg.status === 'submitted' ? `
                        <span style="font-size: 0.8rem; color: #34d399; font-weight: 600;">Score: ${asg.score || 'Grading Pending'}</span>
                      ` : `
                        <button type="button" class="btn btn-primary btn-sm submit-asg-btn" data-id="${asg.id}" data-title="${asg.title}">
                          Submit Work
                        </button>
                      `}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Active Grievance & Issue Tickets Tracker -->
            <div class="feature-card" style="padding: 24px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                  <i data-lucide="ticket" style="width: 20px; height: 20px; color: #c084fc;"></i>
                  <h3 style="font-size: 1.15rem;">My Active Grievance Tickets</h3>
                </div>
                <button type="button" class="link-btn" id="shortcut-report-btn" style="font-size: 0.8rem; color: var(--cyan-primary);">+ New Ticket</button>
              </div>

              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${feedback.map(fb => `
                  <div style="padding: 12px 14px; background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.82rem;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                      <strong style="color: var(--cyan-primary); font-family: var(--font-mono);">${fb.id}</strong>
                      <span class="badge ${fb.status === 'resolved' ? 'badge-emerald' : fb.status === 'under_review' ? 'badge-amber' : 'badge-cyan'}">
                        ${fb.status === 'resolved' ? 'Resolved ✅' : fb.status === 'under_review' ? 'Under Review ⏳' : 'Submitted'}
                      </span>
                    </div>
                    <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 2px;">${fb.title}</div>
                    <div style="color: var(--text-secondary); font-size: 0.78rem;">${fb.description}</div>
                    ${fb.adminNotes ? `
                      <div style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-subtle); color: #34d399; font-size: 0.75rem;">
                        <strong>Dean's Action:</strong> ${fb.adminNotes}
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

          </div>

          <!-- Right Column: Attendance Breakdown & Urgent Notices -->
          <div style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Subject-wise Attendance Breakdown -->
            <div class="feature-card" style="padding: 24px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <h3 style="font-size: 1.15rem;">Subject Attendance</h3>
                <span class="badge ${attendance.overall >= 75 ? 'badge-emerald' : 'badge-rose'}">
                  ${attendance.overall >= 75 ? 'Requirement Met' : 'Below 75%'}
                </span>
              </div>

              <div>
                ${attendance.subjects.map(sub => `
                  <div>
                    <div class="subject-progress-row">
                      <span style="font-weight: 600; color: var(--text-primary);">${sub.subject}</span>
                      <strong style="color: ${sub.percentage >= 75 ? '#34d399' : '#f43f5e'}; font-family: var(--font-mono);">
                        ${sub.percentage}% (${sub.attended}/${sub.total})
                      </strong>
                    </div>
                    <div class="progress-bar-track">
                      <div class="progress-bar-fill" style="width: ${sub.percentage}%; background: ${sub.percentage >= 75 ? 'var(--cyan-primary)' : '#f43f5e'};"></div>
                    </div>
                    ${sub.marginNote ? `
                      <p style="font-size: 0.72rem; color: #fda4af; margin-top: -10px; margin-bottom: 12px;">⚠️ ${sub.marginNote}</p>
                    ` : ''}
                  </div>
                `).join('')}
              </div>

      if (shortcutReport) {
        shortcutReport.addEventListener('click', () => {
          document.getElementById('feedback-modal').classList.add('active');

      }

    // Modal Events Setup
    function initUtilityModalEvents() {
      // Transport Modal
      const openTr = document.getElementById('open-transport-trigger');
      const trModal = document.getElementById('transport-modal');
      const closeTr = document.getElementById('close-transport-modal');
      const trBody = document.getElementById('transport-modal-body');

      if (openTr && trModal) {
        openTr.addEventListener('click', () => {
          const routes = window.CampusDB.getTransportRoutes();
          trBody.innerHTML = routes.map(r => `
            <div style="background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px; margin-bottom: 12px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                <strong style="color: var(--cyan-primary);">${r.routeNumber}</strong>
                <span class="badge ${r.status === 'On Time' ? 'badge-emerald' : 'badge-amber'}">${r.status}</span>
              </div>
              <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px;">
                <strong>Stops:</strong> ${r.pickupPoints}
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
                <span>Morning Departures: ${r.morningTimes.join(', ')}</span>
                <span>Vehicle: ${r.vehicle}</span>
              </div>
            </div>
          `).join('');
          trModal.classList.add('active');
          window.refreshLucideIcons();
        });
      }
      if (closeTr && trModal) closeTr.addEventListener('click', () => trModal.classList.remove('active'));

      // Canteen Modal
      const openCnt = document.getElementById('open-canteen-trigger');
      const cntModal = document.getElementById('canteen-modal');
      const closeCnt = document.getElementById('close-canteen-modal');
      const cntBody = document.getElementById('canteen-modal-body');

      if (openCnt && cntModal) {
        openCnt.addEventListener('click', () => {
          const menu = window.CampusDB.getCanteenMenu();
          cntBody.innerHTML = `
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle);">
              <span>Operating Hours: <strong>08:00 AM - 07:30 PM (Mon-Sat)</strong></span>
              <span class="badge badge-emerald">100% Pure Veg & Jain Available</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              ${menu.map(m => `
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-deep); border-radius: 8px; border: 1px solid var(--border-subtle);">
                  <div>
                    <strong style="color: var(--text-primary); font-size: 0.88rem;">${m.name}</strong>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">${m.category} ${m.description ? `• ${m.description}` : ''}</div>
                  </div>
                  <strong style="color: #34d399; font-family: var(--font-mono); font-size: 0.95rem;">₹${m.price}</strong>
                </div>
              `).join('')}
            </div>
          `;
          cntModal.classList.add('active');
        });
      }
      if (closeCnt && cntModal) closeCnt.addEventListener('click', () => cntModal.classList.remove('active'));

      // Emergency Modal
      const openEm = document.getElementById('open-emergency-trigger');
      const emModal = document.getElementById('emergency-modal');
      const closeEm = document.getElementById('close-emergency-modal');
      const emBody = document.getElementById('emergency-modal-body');

      if (openEm && emModal) {
        openEm.addEventListener('click', () => {
          const contacts = window.CampusDB.getEmergencyContacts();
          emBody.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 12px;">
              ${contacts.map(c => `
                <div style="padding: 12px 14px; background: var(--bg-deep); border: 1px solid rgba(244,63,94,0.25); border-radius: 8px;">
                  <strong style="color: var(--text-primary); display: block; margin-bottom: 4px;">${c.title}</strong>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <a href="tel:${c.contact}" style="color: #f43f5e; font-weight: 700; font-family: var(--font-mono); font-size: 0.95rem;">
                      ${c.contact}
                    </a>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">${c.available}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
          emModal.classList.add('active');
        });
      }
      if (closeEm && emModal) closeEm.addEventListener('click', () => emModal.classList.remove('active'));

      // Feedback Modal
      const openFb = document.getElementById('open-feedback-trigger');
      const fbModal = document.getElementById('feedback-modal');
      const closeFb = document.getElementById('close-feedback-modal');
      const cancelFb = document.getElementById('cancel-fb-btn');
      const fbForm = document.getElementById('feedback-submit-form');
      const closeFbFn = () => fbModal.classList.remove('active');

      if (openFb && fbModal) openFb.addEventListener('click', () => fbModal.classList.add('active'));
      if (closeFb && fbModal) closeFb.addEventListener('click', closeFbFn);
      if (cancelFb && fbModal) cancelFb.addEventListener('click', closeFbFn);

      if (fbForm) {
        fbForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const report = window.CampusDB.submitFeedback({
            category: document.getElementById('fb-category').value,
            title: document.getElementById('fb-title').value,
            description: document.getElementById('fb-desc').value
          });
          closeFbFn();
          window.showToast(`Ticket ${report.id} registered for Dean review`, 'success');
        });
      }

      // Check hash for direct modal triggers
      if (window.location.hash === '#feedback' && fbModal) {
        fbModal.classList.add('active');
      } else if (window.location.hash === '#canteen' && openCnt) {
        openCnt.click();
      } else if (window.location.hash === '#transport' && openTr) {
        openTr.click();
      } else if (window.location.hash === '#emergency' && openEm) {
        openEm.click();
      }
    }

    // Modal for Assignment Submission
    function openSubmissionModal(assignmentId, title) {
      const modal = document.getElementById('action-modal');
      const box = document.getElementById('action-modal-box');
      if (!modal || !box) return;

      box.innerHTML = `
        <div class="modal-header-custom">
          <div>
            <h3 style="font-size: 1.1rem;">Submit Assignment</h3>
            <span style="font-size: 0.8rem; color: var(--text-secondary);">${title}</span>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="close-sub-modal">✕</button>
        </div>
        <div class="modal-body-custom">
          <form id="submission-form">
            <div class="form-group">
              <label class="form-label">Digital GitHub / Colab / Drive URL</label>
              <input type="url" class="form-control" id="submission-url" placeholder="https://github.com/alex-turner/assignment-3" required />
            </div>
            <div class="form-group">
              <label class="form-label">Submission Notes & Comments</label>
              <textarea class="form-control" id="submission-notes" placeholder="Compiled with g++ -std=c++17. All edge cases verified."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
              <button type="button" class="btn btn-secondary" id="cancel-sub-btn">Cancel</button>
              <button type="submit" class="btn btn-primary">Confirm & Submit Work</button>
            </div>
          </form>
        </div>
      `;

      modal.classList.add('active');
      const close = () => modal.classList.remove('active');
      document.getElementById('close-sub-modal').addEventListener('click', close);
      document.getElementById('cancel-sub-btn').addEventListener('click', close);

      document.getElementById('submission-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const notes = document.getElementById('submission-notes').value;
        window.CampusDB.submitAssignment(assignmentId, { notes });
        close();
        window.showToast('Assignment submitted successfully!', 'success');
      });
    }
  </script>
